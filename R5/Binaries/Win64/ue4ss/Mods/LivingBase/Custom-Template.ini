; Custom-Template.ini -- drop-in content for LivingBaseEnhanced's spawn menu.
; Rename this file (keep the "Custom-" prefix and ".ini" extension, e.g. "Custom-MyPack.ini")
; and fill in real /Game/... paths below.
;
; IMPORTANT: also add this file's name as its own line in CustomFilesIndex.txt, in this same
; folder (create that file if it doesn't exist yet -- one filename per line, a ';' at the start
; of a line makes it a comment). This file is NOT auto-discovered by name alone.
;
; Requires a game restart to pick up any change, to either file.
;
; Fields:
;   type     = decor | sign | people | monstrous | animals | pose | handitem   (required)
;   path     = the /Game/... asset (Blueprint class for decor/sign/people/monstrous/animals,
;               unless kind = mesh below; an animation asset for pose; a mesh/weapon asset for
;               handitem, same shape as Config.SOCKETITEMS_TOOLS' own `asset` field)  (required)
;   category = where this lands under its auto-added heading, "> " nests deeper (decor/sign/
;               people/monstrous/animals); the item's TYPE grouping heading for handitem
;               (Weapons/Tools/Bottles/Other, or your own -- ONE segment, not nested)  (optional)
;   label    = display name override (defaults to this entry's [Section Name]) -- for handitem
;               this IS the friendlyName Spawner.ApplySocketItemManual resolves by        (optional)
;   kind     = actor (default) | mesh | effect  -- decor/sign only, see the three Decor examples (optional)
;   fx       = the /Game/... Niagara System asset -- kind = effect only, see that example       (optional)
;   solid    = true | false  -- per-entry collision override, decor/sign only           (optional)
;   idle     = true          -- spawn frozen/idle instead of walking -- people/monstrous/animals only (optional)
;
; Sign text-layout fields (type = sign only, all optional -- see the Sign example below):
;   x, y, z  = the text anchor point, relative to the sign's own actor root (uu)
;   depth    = how far in FRONT of that anchor the text floats (uu)
;   yaw, pitch, roll = facing/tilt of the text (degrees)
;   bw, bh   = board width/height the text must fit inside (uu)
;   size     = largest text size allowed (uu)
;   rows     = max text lines (defaults to the Signs tab's own max, usually 4)
;   Left untuned, a sign still accepts text, just not necessarily well-placed on the mesh. Tune it
;   live in-game with `lbtestsigntext <text> x= y= z= yaw= pitch= roll= bw= bh= size=` on the exact
;   item you just spawned, then copy the final numbers into this file.
;
; Tree destination: decor/sign/people/monstrous/animals appear on the main Spawn Tree under
;   Custom Content > <People|Decor|Signs|Monstrous|Animals> > <category> > <name>
; `pose` entries appear in the existing Poses tree (in the separate Custom tab, Poses and Actions
; section) under Custom > Poses > Custom > <category> > <name>
; `handitem` entries appear in the Custom tab's Hand item tree (same section, below Poses) under
;   Custom > Hand > <category> > <name>
; -- click its "+" to apply it to whichever hand (Left/Right) is currently radio-selected there.

[My Decor Item]
type = decor
kind = actor
path = /Game/REPLACE/WITH/REAL/BP_SomeDecorItem.BP_SomeDecorItem_C
category = My Decor

[My Mesh-Only Decor Item]
type = decor
kind = mesh
path = /Game/REPLACE/WITH/REAL/SM_SomeStaticMesh.SM_SomeStaticMesh
category = My Decor
solid = true

[My Effect Item]
type = decor
kind = effect
; path omitted on purpose -- defaults to the native NiagaraActor class, same invisible actor
; Decor > Misc > Water's built-in fountain-spray/splash entries already use.
fx = /Game/REPLACE/WITH/REAL/FX_SomeNiagaraSystem.FX_SomeNiagaraSystem
category = My Decor

[My Sign Item]
type = sign
path = /Game/REPLACE/WITH/REAL/BP_SomeSignOrFlag.BP_SomeSignOrFlag_C
; Starting guesses -- tune live with lbtestsigntext on this exact item, then replace these:
x = 0.0
y = 0.0
z = 0.0
depth = -2.0
yaw = 0.0
bw = 100.0
bh = 50.0
size = 30.0

[My Person]
type = people
path = /Game/REPLACE/WITH/REAL/BP_SomeCharacter.BP_SomeCharacter_C
category = My Crew

[My Monster]
type = monstrous
path = /Game/REPLACE/WITH/REAL/BP_SomeMonster.BP_SomeMonster_C
category = My Monsters
idle = true

[My Animal]
type = animals
path = /Game/REPLACE/WITH/REAL/BP_SomeAnimal.BP_SomeAnimal_C
category = My Animals

[My Pose]
type = pose
path = /Game/REPLACE/WITH/REAL/AM_SomeAnimation
category = My Poses

[My Hand Item]
type = handitem
path = /Game/REPLACE/WITH/REAL/SM_SomeWeaponOrTool
category = My Items
label = My Cool Sword
