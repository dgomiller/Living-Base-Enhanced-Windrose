; Custom-Template.ini -- drop-in content for LivingBaseEnhanced's spawn menu.
; Rename this file (keep the "Custom-" prefix and ".ini" extension, e.g. "Custom-MyPack.ini")
; and fill in real /Game/... paths below. Each [Section Name] below is one entry.
;
; Whatever comes AFTER "Custom-" in the filename becomes that file's own branch name in the
; tree -- "Custom-DansStuff.ini" groups everything it contains under a "DansStuff" branch, kept
; separate from every other Custom-*.ini file's own content (even other entries of the same
; type) so each download stays its own clearly-labeled thing. See each type's own "Tree:" line
; below for exactly where that branch lands.
;
; IMPORTANT: also add this file's name as its own line in CustomFilesIndex.txt, in this same
; folder (create that file if it doesn't exist yet -- one filename per line, a ';' at the start
; of a line makes it a comment). This file is NOT auto-discovered by name alone.
;
; After editing either file: either restart the game, OR in-game click the "Update" button next
; to the Spawn Tree's filter box to pull in the changes live -- no restart needed.
;
; ==========================================================================================
; TYPE-BY-TYPE BREAKDOWN -- every option each type accepts, and what it does.
; "(required)" fields must be set; everything else is optional and can be left out entirely.
; ==========================================================================================
;
; ---- type = decor -------------------------------------------------------------------------
;   A static or Blueprint prop placed in the world from the main Spawn Tree.
;     path      (required unless kind = effect) the /Game/... asset -- a Blueprint class ending
;                in _C for kind = actor, or a bare static mesh (no _C) for kind = mesh.
;     kind      actor (default) | mesh | effect
;                 actor  = path is a real Blueprint class, spawned directly.
;                 mesh   = path is a bare static mesh, wrapped in a generic solid-capable prop.
;                 effect = a pure visual effect with no mesh at all -- see `fx` below. path can
;                          be left out entirely for this kind (it defaults automatically).
;     fx        (kind = effect only) the /Game/... Niagara System asset to attach.
;     category  where this nests under Custom Content > Decor > ... -- "> " nests deeper, e.g.
;                "Lights > Torches".
;     label     display name override (defaults to this entry's [Section Name]).
;     solid     true | false -- whether the prop blocks movement. Left out, it follows this
;                mod's global decor-collision setting instead.
;   Tree: Custom Content > <this file's name> > Decor > <category> > <name>
;
; ---- type = sign ---------------------------------------------------------------------------
;   Same actor/mesh placement as decor, but can also carry text via the Signs tab.
;     path      (required) same actor/mesh rules as decor's path (no "effect" kind for signs).
;     kind      actor (default) | mesh -- same meaning as decor's kind.
;     category / label / solid -- same as decor, above.
;   Text-layout fields (all optional -- an untuned sign still accepts text, just maybe not
;   well-placed on the mesh):
;     x, y, z            text anchor point, relative to the sign's own actor root (uu)
;     depth              how far in FRONT of that anchor the text floats (uu)
;     yaw, pitch, roll   facing/tilt of the text (degrees)
;     bw, bh             board width/height the text must fit inside (uu)
;     size               largest text size allowed (uu)
;     rows               max text lines (defaults to the Signs tab's own max, usually 4)
;   Tune it live: spawn the item, then run (on that exact item)
;     lbtestsigntext <text> x= y= z= yaw= pitch= roll= bw= bh= size=
;   and copy the final numbers back into this file.
;   Tree: Custom Content > <this file's name> > Signs > <category> > <name>
;
; ---- type = people -------------------------------------------------------------------------
;   A walking NPC/crew member.
;     path      (required) a Blueprint character class.
;     category / label -- same as decor, above.
;     idle      true -- spawn frozen in place instead of walking.
;   Tree: Custom Content > <this file's name> > People > <category> > <name>
;
; ---- type = monstrous ----------------------------------------------------------------------
;   Exactly the same options as people, above, for monster-category Blueprint classes.
;   Tree: Custom Content > <this file's name> > Monstrous > <category> > <name>
;
; ---- type = animals -------------------------------------------------------------------------
;   Exactly the same options as people, above, for animal-category Blueprint classes.
;   Tree: Custom Content > <this file's name> > Animals > <category> > <name>
;
; ---- type = pose ----------------------------------------------------------------------------
;   An animation applied to whatever's currently target-locked.
;     path      (required) an animation asset (no class, no _C).
;     category / label -- same as decor, above (no kind/solid/idle -- they don't apply here).
;   Tree: Custom tab > Poses and Actions > Custom > Poses > <this file's name> > <category> >
;   <name> -- click it to apply to the currently locked target.
;
; ---- type = handitem ------------------------------------------------------------------------
;   An item equippable into a hand socket from the Custom tab's Hand item tree.
;     path      (required) a mesh/weapon asset (static or skeletal mesh, auto-detected) -- same
;                shape this mod's own built-in hand items use.
;     category  the item's TYPE grouping heading (Weapons/Tools/Bottles/Other, or your own) --
;                ONE segment, not nested with "> ".
;     label     the display name AND the friendlyName this item is applied/looked-up by.
;                Defaults to this entry's [Section Name].
;   Tree: Custom tab > Poses and Actions > Hand Item Transform's tree, under Custom > Hand >
;   <this file's name> > <category> > <name> -- click its "+" to equip it on whichever hand
;   (Left/Right) is currently radio-selected there. Once equipped, the same panel's
;   Move/Rotate/Scale controls apply to it.
;
; ==========================================================================================
; EXAMPLES -- one filled-in entry per type/kind below. Replace every /Game/REPLACE/WITH/REAL/...
; path with a real asset path (probe a similar wild item in-game, or check pakcontents.xlsx).
; ==========================================================================================

[My Decor Item]
type = decor
kind = actor
path = /Game/REPLACE/WITH/REAL/BP_SomeDecorItem.BP_SomeDecorItem_C
category = My Decor

[My Mesh-Only Decor Item]
type = decor
kind = mesh
path = /Game/REPLACE/WITH/REAL/SM_SomeStaticMesh.SM_SomeStaticMesh
category = My Decor
solid = true

[My Effect Item]
type = decor
kind = effect
; path omitted on purpose -- defaults to the native NiagaraActor class, same invisible actor
; Decor > Misc > Water's built-in fountain-spray/splash entries already use.
fx = /Game/REPLACE/WITH/REAL/FX_SomeNiagaraSystem.FX_SomeNiagaraSystem
category = My Decor

[My Sign Item]
type = sign
path = /Game/REPLACE/WITH/REAL/BP_SomeSignOrFlag.BP_SomeSignOrFlag_C
; Starting guesses -- tune live with lbtestsigntext on this exact item, then replace these:
x = 0.0
y = 0.0
z = 0.0
depth = -2.0
yaw = 0.0
bw = 100.0
bh = 50.0
size = 30.0

[My Person]
type = people
path = /Game/REPLACE/WITH/REAL/BP_SomeCharacter.BP_SomeCharacter_C
category = My Crew

[My Monster]
type = monstrous
path = /Game/REPLACE/WITH/REAL/BP_SomeMonster.BP_SomeMonster_C
category = My Monsters
idle = true

[My Animal]
type = animals
path = /Game/REPLACE/WITH/REAL/BP_SomeAnimal.BP_SomeAnimal_C
category = My Animals

[My Pose]
type = pose
path = /Game/REPLACE/WITH/REAL/AM_SomeAnimation
category = My Poses

[My Hand Item]
type = handitem
path = /Game/REPLACE/WITH/REAL/SM_SomeWeaponOrTool
category = My Items
label = My Cool Sword
